<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akıllı Sepet - Kasiyersiz Ödeme Sistemi</title>
    <style>
        /* CSS Tasarım Kısmı - modern ve sade tasarım */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .ana-kapsayici {
            display: flex;
            width: 1000px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        /* Sol Taraf: Kamera / YOLO Görüntüsü Gelecek Yer */
        .kamera-alani {
            flex: 1;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .kamera-kutusu {
            width: 100%;
            height: 300px;
            background-color: #34495e;
            border: 2px dashed #7f8c8d;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        /* Sağ Taraf: Sepet ve Ödeme */
        .sepet-alani {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
        }
        h2 { color: #2c3e50; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px;}
        
        .urun-listesi {
            flex-grow: 1;
            min-height: 150px;
            margin-bottom: 20px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 8px;
            overflow-y: auto;
        }
        .urun-satiri {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
        }
        .toplam-tutar {
            font-size: 24px;
            font-weight: bold;
            color: #e74c3c;
            text-align: right;
            margin-bottom: 20px;
        }
        /* Kart Formu Tasarımı */
        .form-grubu { margin-bottom: 15px; }
        .form-grubu label { display: block; margin-bottom: 5px; font-weight: bold; color: #555;}
        .form-grubu input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;}
        .tarih-cvc { display: flex; gap: 10px; }
        .tarih-cvc input { width: 100%; }
        
        .btn-ode {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-ode:hover { background-color: #2ecc71; }
        
        /* Bildirim Pop-up'ı */
        #bildirim {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: none; /* Başlangıçta gizli */
            text-align: center;
            font-weight: bold;
        }
        .basarili { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb;}
        .hata { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;}
    </style>
</head>
<body>

    <div class="ana-kapsayici">
        <div class="kamera-alani">
            <h2>🛒 Akıllı Sepet Görüşü</h2>
            <div class="kamera-kutusu">
                <p>Kamera bağlantısı bekleniyor...<br><small>(YOLOv11 ve Sensör Verisi)</small></p>
            </div>
            <p>Sepete eklenen ürünler kamera ve Load Cell tarafından anlık olarak doğrulanmaktadır.</p>
        </div>

        <div class="sepet-alani">
            <h2>Sepetiniz</h2>
            
            <div id="bildirim"></div>

            <div class="urun-listesi" id="urun-listesi-div">
                <div class="urun-satiri"><span>Sepetiniz şu an boş...</span><span>0.00 TL</span></div>
            </div>

            <div class="toplam-tutar">
                Toplam: <span id="toplam-fiyat">0.00</span> TL
            </div>

            <div class="form-grubu">
                <label>Kart Numarası</label>
                <input type="text" id="kart_no" value="4242 4242 4242 4242"> 
            </div>
            <div class="tarih-cvc">
                <div class="form-grubu" style="flex: 1;">
                    <label>Ay (MM)</label>
                    <input type="text" id="ay" value="12">
                </div>
                <div class="form-grubu" style="flex: 1;">
                    <label>Yıl (YY)</label>
                    <input type="text" id="yil" value="2030">
                </div>
                <div class="form-grubu" style="flex: 1;">
                    <label>CVC</label>
                    <input type="text" id="cvc" value="123">
                </div>
            </div>

            <button class="btn-ode" onclick="odemeYap()" id="ode-butonu">Ödemeyi Tamamla 💳</button>
        </div>
    </div>

    <script>
        // Sepeti canlı tutmak için her 2 saniyede bir Python sunucusuna (API) soru soruyoruz
        function sepetiGuncelle() {
            fetch('/sepet_bilgisi')
                .then(response => response.json())
                .then(data => {
                    const listeDiv = document.getElementById('urun-listesi-div');
                    const toplamFiyatSpan = document.getElementById('toplam-fiyat');
                    
                    // Sepet boşsa
                    if (data.urunler.length === 0) {
                        listeDiv.innerHTML = '<div class="urun-satiri"><span>Sepetiniz şu an boş...</span><span>0.00 TL</span></div>';
                    } else {
                        // Sepet doluysa listeyi temizle ve ürünleri bas
                        listeDiv.innerHTML = '';
                        data.urunler.forEach(urun => {
                            listeDiv.innerHTML += `
                                <div class="urun-satiri">
                                    <span>${urun.ad}</span>
                                    <strong>${urun.fiyat.toFixed(2)} TL</strong>
                                </div>
                            `;
                        });
                    }
                    // Toplam fiyatı güncelle
                    toplamFiyatSpan.innerText = data.toplam.toFixed(2);
                });
        }

        // Sayfa açıldığında sepeti getir ve her 2 saniyede bir yenile
        sepetiGuncelle();
        setInterval(sepetiGuncelle, 2000); 

        // Ödeme butonuna basıldığında çalışacak fonksiyon
        function odemeYap() {
            const btn = document.getElementById('ode-butonu');
            const bildirim = document.getElementById('bildirim');
            
            // Butonu kilitle ve yazısını değiştir
            btn.disabled = true;
            btn.innerText = "İyzico ile İletişim Kuruluyor... ⏳";
            bildirim.style.display = 'none';

            // Kutucuklardaki verileri al
            const kartVerisi = {
                kart_no: document.getElementById('kart_no').value,
                ay: document.getElementById('ay').value,
                yil: document.getElementById('yil').value,
                cvc: document.getElementById('cvc').value
            };

            // Python sunucusuna POST isteği atıyoruz
            fetch('/odeme_yap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(kartVerisi)
            })
            .then(response => response.json())
            .then(data => {
                bildirim.style.display = 'block';
                if (data.durum === 'basarili') {
                    bildirim.className = 'basarili';
                    bildirim.innerText = "✅ " + data.mesaj;
                } else {
                    bildirim.className = 'hata';
                    bildirim.innerText = "❌ " + data.mesaj;
                }
                
                // İşlem bitince butonu eski haline getir
                btn.disabled = false;
                btn.innerText = "Ödemeyi Tamamla 💳";
                
                // Sepet sıfırlanmış olabileceği için arayüzü hemen güncelle
                sepetiGuncelle();
            })
            .catch(error => {
                alert("Sunucuya bağlanırken bir hata oluştu!");
                btn.disabled = false;
                btn.innerText = "Ödemeyi Tamamla 💳";
            });
        }
    </script>
</body>
</html>
