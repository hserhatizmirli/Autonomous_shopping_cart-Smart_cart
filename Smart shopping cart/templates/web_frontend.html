<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akıllı Sepet - Kasiyersiz Ödeme Sistemi</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .ana-kapsayici { display: flex; width: 1000px; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; }
        .kamera-alani { flex: 1; background-color: #2c3e50; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        .kamera-kutusu { width: 100%; height: 300px; background-color: transparent; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
        .sepet-alani { flex: 1; padding: 40px; display: flex; flex-direction: column; }
        h2 { color: #2c3e50; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px;}
        .urun-listesi { flex-grow: 1; min-height: 150px; margin-bottom: 20px; padding: 10px; background: #f9f9f9; border-radius: 8px; overflow-y: auto; }
        
        /* Sepet Satırları ve Buton Tasarımları */
        .urun-satiri { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; border-bottom: 1px solid #ddd; }
        .urun-ad { flex: 2; font-weight: 500; }
        .urun-adet-kontrol { flex: 1; display: flex; align-items: center; gap: 8px; }
        .urun-fiyat-sil { flex: 1; text-align: right; }
        
        .btn-kucuk { background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; padding: 3px 8px; font-weight: bold; }
        .btn-kucuk:hover { background: #2980b9; }
        .btn-sil { background: transparent; border: none; cursor: pointer; font-size: 16px; margin-left: 10px; transition: transform 0.2s; }
        .btn-sil:hover { transform: scale(1.2); }

        .toplam-tutar { font-size: 24px; font-weight: bold; color: #e74c3c; text-align: right; margin-bottom: 20px; }
        .form-grubu { margin-bottom: 15px; }
        .form-grubu label { display: block; margin-bottom: 5px; font-weight: bold; color: #555;}
        .form-grubu input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;}
        .tarih-cvc { display: flex; gap: 10px; }
        .tarih-cvc input { width: 100%; }
        
        .btn-ode { background-color: #27ae60; color: white; border: none; padding: 15px; font-size: 18px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; transition: background 0.3s; }
        .btn-ode:hover { background-color: #2ecc71; }
        #bildirim { padding: 15px; margin-bottom: 20px; border-radius: 5px; display: none; text-align: center; font-weight: bold; }
        .basarili { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb;}
        .hata { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;}
    </style>
</head>
<body>

    <div class="ana-kapsayici">
        <div class="kamera-alani">
            <h2>🛒 Akıllı Sepet Görüşü</h2>
            <div class="kamera-kutusu">
                <img src="/video_akis" style="width: 100%; height: 100%; object-fit: cover; border-radius: 10px; border: 2px dashed #7f8c8d;" alt="Kamera Yükleniyor...">
            </div>
            <p>Sepete eklenen ürünler kamera ve Load Cell tarafından anlık olarak doğrulanmaktadır.</p>
        </div>

        <div class="sepet-alani">
            <h2>Sepetiniz</h2>
            <div id="bildirim"></div>

            <div class="urun-listesi" id="urun-listesi-div">
                <div class="urun-satiri"><span>Sepetiniz şu an boş...</span><span>0.00 TL</span></div>
            </div>

            <div class="toplam-tutar">
                Toplam: <span id="toplam-fiyat">0.00</span> TL
            </div>

            <div class="form-grubu">
                <label>Kart Numarası (Test MasterCard)</label>
                <input type="text" id="kart_no" value="5400 3600 0000 0003"> 
            </div>
            <div class="tarih-cvc">
                <div class="form-grubu" style="flex: 1;">
                    <label>Ay (MM)</label>
                    <input type="text" id="ay" value="12">
                </div>
                <div class="form-grubu" style="flex: 1;">
                    <label>Yıl (YY)</label>
                    <input type="text" id="yil" value="2030">
                </div>
                <div class="form-grubu" style="flex: 1;">
                    <label>CVC</label>
                    <input type="text" id="cvc" value="123">
                </div>
            </div>

            <button class="btn-ode" onclick="odemeYap()" id="ode-butonu">Ödemeyi Tamamla 💳</button>
        </div>
    </div>

    <script>
        // Miktar azaltma, artırma ve silme işlemleri için Backend API İsteği
        function urunIslem(urun_id, islemTuru) {
            fetch('/sepet_guncelle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({id: urun_id, islem: islemTuru})
            }).then(() => sepetiGuncelle());
        }

        // Sepeti her 2 saniyede bir güncelleyen ana fonksiyon
        function sepetiGuncelle() {
            fetch('/sepet_bilgisi')
                .then(response => response.json())
                .then(data => {
                    const listeDiv = document.getElementById('urun-listesi-div');
                    const toplamFiyatSpan = document.getElementById('toplam-fiyat');
                    
                    if (data.urunler.length === 0) {
                        listeDiv.innerHTML = '<div class="urun-satiri"><span>Sepetiniz şu an boş...</span><span>0.00 TL</span></div>';
                    } else {
                        listeDiv.innerHTML = '';
                        data.urunler.forEach(urun => {
                            let toplamSatirFiyati = (urun.fiyat * urun.adet).toFixed(2);
                            
                            listeDiv.innerHTML += `
                                <div class="urun-satiri">
                                    <div class="urun-ad">${urun.ad}</div>
                                    <div class="urun-adet-kontrol">
                                        <button class="btn-kucuk" onclick="urunIslem('${urun.id}', 'azalt')">-</button>
                                        <span>x${urun.adet}</span>
                                        <button class="btn-kucuk" onclick="urunIslem('${urun.id}', 'artir')">+</button>
                                    </div>
                                    <div class="urun-fiyat-sil">
                                        <strong>${toplamSatirFiyati} TL</strong>
                                        <button class="btn-sil" onclick="urunIslem('${urun.id}', 'sil')" title="Sil">🗑️</button>
                                    </div>
                                </div>
                            `;
                        });
                    }
                    toplamFiyatSpan.innerText = data.toplam_tutar.toFixed(2);
                });
        }

        // Sayfa açılışında döngüyü başlat
        sepetiGuncelle();
        setInterval(sepetiGuncelle, 2000); 

        // Ödeme işlemi
        function odemeYap() {
            const btn = document.getElementById('ode-butonu');
            const bildirim = document.getElementById('bildirim');
            
            btn.disabled = true;
            btn.innerText = "İyzico ile İletişim Kuruluyor... ⏳";
            bildirim.style.display = 'none';

            const kartVerisi = {
                kart_no: document.getElementById('kart_no').value,
                ay: document.getElementById('ay').value,
                yil: document.getElementById('yil').value,
                cvc: document.getElementById('cvc').value
            };

            fetch('/odeme_yap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(kartVerisi)
            })
            .then(response => response.json())
            .then(data => {
                bildirim.style.display = 'block';
                if (data.durum === 'basarili') {
                    bildirim.className = 'basarili';
                    bildirim.innerText = "✅ " + data.mesaj;
                } else {
                    bildirim.className = 'hata';
                    bildirim.innerText = "❌ " + data.mesaj;
                }
                
                btn.disabled = false;
                btn.innerText = "Ödemeyi Tamamla 💳";
                sepetiGuncelle();
            })
            .catch(error => {
                alert("Sunucuya bağlanırken bir hata oluştu!");
                btn.disabled = false;
                btn.innerText = "Ödemeyi Tamamla 💳";
            });
        }
    </script>
</body>
</html>
